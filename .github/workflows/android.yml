
name: Build Pedantic Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Android ARM64 Native AOT
    runs-on: ubuntu-22.04

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      ANDROID_API_LEVEL: 24
      TARGET_RID: linux-bionic-arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Pin .NET SDK 9.0.102
        shell: bash
        run: |
          set -euo pipefail

          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "9.0.102",
              "rollForward": "disable",
              "allowPrerelease": false
            }
          }
          EOF

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.102

      - name: Verify SDK version
        shell: bash
        run: |
          set -euo pipefail

          dotnet --version

          if [ "$(dotnet --version)" != "9.0.102" ]; then
            echo "::error::Wrong .NET SDK selected."
            exit 1
          fi

      - name: Download Android NDK r26b
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"

          curl -fL \
            https://dl.google.com/android/repository/android-ndk-r26b-linux.zip \
            -o android-ndk.zip

          unzip -q android-ndk.zip

          echo "ANDROID_NDK_ROOT=$RUNNER_TEMP/android-ndk-r26b" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r26b" >> "$GITHUB_ENV"

          echo "$RUNNER_TEMP/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Android NDK
        shell: bash
        run: |
          set -euo pipefail

          test -x "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          clang --version

      - name: Exclude Windows-only tablebase project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path("Pedantic/Pedantic.csproj")
          source = project.read_text(encoding="utf-8-sig")

          groups = list(re.finditer(
              r"<ItemGroup\b[^>]*>.*?</ItemGroup>",
              source,
              flags=re.DOTALL
          ))

          matches = [
              match for match in groups
              if "Pedantic.Tablebase.vcxproj" in match.group(0)
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "Expected exactly one tablebase ItemGroup; found "
                  + str(len(matches))
              )

          match = matches[0]
          source = source[:match.start()] + source[match.end():]

          project.write_text(source, encoding="utf-8")

          print("Windows tablebase project excluded for Android.")
          PY

      - name: Verify Android source guards
        shell: bash
        run: |
          set -euo pipefail

          grep -q "PEDANTIC_ANDROID_BIONIC" Pedantic/Program.cs
          grep -q "PEDANTIC_ANDROID_BIONIC" Pedantic/Chess/Engine.cs
          grep -q "PEDANTIC_ANDROID_BIONIC" Pedantic/Chess/BasicSearch.cs

          if grep -q "Pedantic.Tablebase.vcxproj" Pedantic/Pedantic.csproj; then
            echo "::error::Tablebase project reference remains."
            exit 1
          fi

          echo "Android guards verified."

      - name: Restore Android Native AOT dependencies
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore Pedantic/Pedantic.csproj \
            --runtime "$TARGET_RID" \
            -p:PublishAot=true \
            -p:PublishAotUsingRuntimePack=true \
            -p:DisableUnsupportedError=true \
            -p:InvariantGlobalization=true \
            -p:DefineConstants=PEDANTIC_ANDROID_BIONIC

      - name: Publish Android ARM64 Native AOT
        shell: bash
        run: |
          set -euo pipefail

          dotnet publish Pedantic/Pedantic.csproj \
            --configuration Release \
            --framework net9.0 \
            --runtime "$TARGET_RID" \
            --self-contained true \
            --no-restore \
            -p:PublishAot=true \
            -p:PublishAotUsingRuntimePack=true \
            -p:DisableUnsupportedError=true \
            -p:InvariantGlobalization=true \
            -p:StripSymbols=true \
            -p:DefineConstants=PEDANTIC_ANDROID_BIONIC

      - name: Verify executable
        shell: bash
        run: |
          set -euo pipefail

          BINARY="Pedantic/bin/Release/net9.0/$TARGET_RID/publish/Pedantic"

          if [ ! -f "$BINARY" ]; then
            echo "::error::Native AOT executable not found."
            find Pedantic/bin/Release -type f
            exit 1
          fi

          chmod +x "$BINARY"

          echo "===== File ====="
          file "$BINARY"

          echo "===== ELF Header ====="
          readelf -h "$BINARY"

          readelf -h "$BINARY" | grep -q "ELF64"
          readelf -h "$BINARY" | grep -q "AArch64"

          echo "===== Dynamic Dependencies ====="
          readelf -d "$BINARY" || true

          echo "===== Program Interpreter ====="
          readelf -l "$BINARY" | grep -i interpreter || true

          echo "Android ARM64 ELF verification passed."

      - name: Upload Android ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: Pedantic-Android-ARM64
          path: Pedantic/bin/Release/net9.0/linux-bionic-arm64/publish/Pedantic
          if-no-files-found: error
          retention-days: 30
